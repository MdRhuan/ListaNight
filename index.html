<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Titulo e og: tags sao preenchidos pelo bloco EDITE AQUI, que fica em app.js.
       Nao edite aqui: o JS sobrescreve. -->
  <title>Carregando...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Envie seu nome para a lista de convidados">
  <meta property="og:title" id="ogTitle" content="">
  <meta property="og:description" content="Envie seu nome para a lista de convidados">
  <meta property="og:site_name" id="ogSite" content="">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twTitle" content="">

  <!-- Font Awesome 4.7 (fa-user, fa-phone, fa-birthday-cake, fa-paper-plane, fa-map-marker...) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <!-- SweetAlert2 - modal de confirmacao -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.10.5/sweetalert2.min.css">
  <!-- Roboto: a fonte do layout novo da Vipme -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">

  <link rel="stylesheet" href="styles.css?v=3">
</head>

<body>

<!-- Barra do topo: nome do local, centralizado -->
<header class="topbar">
  <span id="topTitle"></span>
</header>

<main class="page">

  <!-- Card 1: a lista + formulario -->
  <section class="card">
    <span class="badge">
      <!-- FA 4.7 nao tem coroa; SVG inline no lugar -->
      <svg class="badge-crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5L3 7z" fill="currentColor"/></svg>
      Lista
    </span>
    <h2 class="card-title" id="listName"></h2>
    <p class="card-note" id="listDescription" hidden></p>

    <form novalidate id="guestForm">
      <div id="attendingList"></div>

      <div class="multi-row" id="multiNameRow">
        <div id="removeSlot"></div>
        <button type="button" class="btn-ghost" id="btnAdd">
          <i class="fa fa-plus"></i> Adicionar outro convidado
        </button>
      </div>

      <button type="submit" class="btn-send btn-send-data">
        <span class="btn-send-ico"><i class="fa fa-paper-plane" aria-hidden="true"></i></span>
        <span class="btn-send-label">Enviar nome</span>
      </button>
    </form>
  </section>

  <!-- Card 2: o evento -->
  <section class="card">
    <span class="badge"><i class="fa fa-map-marker" aria-hidden="true"></i> <span id="placeName"></span></span>
    <h2 class="card-title" id="eventName"></h2>
    <div class="event-meta">
      <div class="event-meta-item">
        <i class="fa fa-calendar-check-o" aria-hidden="true"></i>
        <div><small>Data</small><strong id="eventDate"></strong></div>
      </div>
      <div class="event-meta-item">
        <i class="fa fa-clock-o" aria-hidden="true"></i>
        <div><small>Horário</small><strong id="eventTime"></strong></div>
      </div>
    </div>
  </section>

  <!-- Card 3: grupos de WhatsApp (continuam no fim da pagina) -->
  <section class="card groups-block">
    <span class="badge"><i class="fa fa-whatsapp" aria-hidden="true"></i> Grupos</span>
    <h2 class="card-title" id="gruposTitulo"></h2>
    <div class="groups-grid" id="gruposCards"></div>
  </section>

</main>

<!-- Rodape removido (logo Vipme, copyright e links). -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.10.5/sweetalert2.min.js"></script>
<script src="app.js?v=4"></script>
</body>
</html>
